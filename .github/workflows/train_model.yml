name: Train and evaluate models

on:
  push:
    branches:
      - "yunzhang's-branch"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: clean incoming batch
        if: ${{ hashFiles('batch.csv') != '' }}
        run: python clean_batch.py

      - name: Save batch report
        if: ${{ hashFiles('batch.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: batch-report
          path: batch_report.csv
          if-no-files-found: error

      - name: Train and evaluate
        run: python train_model.py

      - name: Save evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: model_metrics.csv
          if-no-files-found: error